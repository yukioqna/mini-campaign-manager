version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: campaign_user
      POSTGRES_PASSWORD: campaign_password
      POSTGRES_DB: campaign_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U campaign_user -d campaign_db']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      PORT: '3001'
      NODE_ENV: production
      DATABASE_URL: postgresql://campaign_user:campaign_password@postgres:5432/campaign_db
      JWT_SECRET: ${JWT_SECRET:-f6P2lqR2sph036CqMyK0cgbCD5Cyrys28fIJrm5QzId}
    env_file:
      - server/.env.production
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3001/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: client/Dockerfile
    environment:
      VITE_API_URL: /api
    ports:
      - '8080:80'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
